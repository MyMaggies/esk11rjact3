aring or being consulted — she is discussed only as 'her,' 'she,' and 'my child.'","effect":"This absence is itself the point: Shakespeare shows a young woman's future being decided entirely by the men around her (and by her mother, acting on her father's orders), while she has no voice in the decision at all.","ask":"Why might Shakespeare choose to keep Juliet completely absent from a scene that decides her fate?","tags":["family","context"],"support":"Throughout this scene, Juliet is only ever referred to as '___,' never given the chance to ___. This shows ___.","revise":true}]},{"type":"link","key":"l2","short":"That night...","mins":2,"title":"That night...","text":"While Capulet and Paris finalise their wedding plans downstairs, Romeo secretly climbs up to Juliet's chamber. They spend their first and only night together as husband and wife — knowing that if he is found in Verona after sunrise, the punishment is {{death}}, not just {{banishment}}. Just before dawn, he must climb back down and flee to {{Mantua}}.","ext":"Why might Shakespeare choose not to show this night directly on stage?"},{"type":"extract","key":"e4","short":"3.5 Dawn parting","mins":13,"label":"Extract 2","title":"Act 3, Scene 5: ‘It was the nightingale, and not the lark’","sub":"Romeo must flee to Mantua before daybreak. Juliet tries to make the night last longer.","setup":"It's just before dawn, the morning after Romeo and Juliet's secret wedding night. He must leave for Mantua before he's discovered.","task":"Underline every moment Juliet tries to argue it is still night. Circle the point where she gives up and admits it's morning.","think":"With a partner (30 seconds): why might Juliet argue against the thing she knows is true?","thinkSecs":30,"scene":"3.5","lines":[{"k":"sp","t":"Juliet"},{"k":"ln","n":1,"t":"Wilt thou be gone? It is not yet near day.\nIt was the nightingale, and not the lark,\nThat pierced the fearful hollow of thine ear.\nNightly she sings on yond pomegranate tree.\nBelieve me, love, it was the nightingale.","g":"Are you really leaving already? It's not morning yet — that was a nightingale singing just now, not the lark (a bird that only sings at dawn). Believe me, it's still night."},{"k":"sp","t":"Romeo"},{"k":"ln","n":2,"t":"It was the lark, the herald of the morn,\nNo nightingale. Look, love, what envious streaks\nDo lace the severing clouds in yonder east.\nNight's candles are burnt out, and jocund day\nStands tiptoe on the misty mountain-tops.\nI must be gone and live, or stay and die.","g":"No, that was the lark, which announces morning. Look, the sky is already streaked with light in the east — night is over and day is breaking. I have to leave now if I want to stay alive; if I stay, I'll be caught and killed."},{"k":"sp","t":"Juliet"},{"k":"ln","n":3,"t":"Yond light is not daylight, I know it, I.\nIt is some meteor that the sun exhaled\nTo be to thee this night a torchbearer\nAnd light thee on thy way to Mantua.\nTherefore stay yet. Thou need'st not to be gone.","g":"That light isn't the sun, I'm sure of it — it's just some meteor the sun sent out, lighting your way to Mantua like a torch-bearer. So stay a while longer, you don't have to go yet."},{"k":"sp","t":"Romeo"},{"k":"ln","n":4,"t":"Let me be ta'en, let me be put to death.\nI am content, so thou wilt have it so.\nI'll say yon gray is not the morning's eye,\n’Tis but the pale reflex of Cynthia's brow.\nNor that is not the lark whose notes do beat\nThe vaulty heaven so high above our heads.\nI have more care to stay than will to go.\nCome death and welcome. Juliet wills it so.\nHow is 't, my soul? Let's talk. It is not day.","g":"Fine — let them catch and kill me, then, if that's what you want. I'll agree that grey light isn't morning, just moonlight, and that's not the lark singing high above us. I'd rather stay than go. Let death come, if that's what you want. How are you, my love? Let's keep talking — it isn't day."},{"k":"sp","t":"Juliet"},{"k":"ln","n":5,"t":"It is, it is. Hie hence, begone, away!\nIt is the lark that sings so out of tune,\nStraining harsh discords and unpleasing sharps.\nSome say the lark makes sweet division.\nThis doth not so, for she divideth us.\nSome say the lark and loathèd toad changed eyes.\nO, now I would they had changed voices too,\nSince arm from arm that voice doth us affray,\nHunting thee hence with hunt's-up to the day.\nO, now begone. More light and light it grows.","g":"No — it is morning. Go, quickly, hurry! Suddenly that lark's song sounds harsh and unpleasant to me, not sweet at all, because it's the sound pulling us apart. There's an old tale that the lark and the ugly toad swapped eyes with each other — I wish they'd swapped voices too, since this one is chasing you away as it gets lighter and lighter."},{"k":"sp","t":"Romeo"},{"k":"ln","n":6,"t":"More light and light, more dark and dark our woes.","g":"The more daylight there is, the darker our situation becomes."},{"k":"st","t":"Enter Nurse.","key":"s6"},{"k":"sp","t":"Nurse"},{"k":"ln","n":7,"t":"Madam!","g":"Juliet!"},{"k":"sp","t":"Juliet"},{"k":"ln","n":8,"t":"Nurse?","g":"Yes?"},{"k":"sp","t":"Nurse"},{"k":"ln","n":9,"t":"Your lady mother is coming to your chamber.\nThe day is broke; be wary; look about.","g":"Your mother is on her way to your room right now — it's definitely daylight, so be careful."},{"k":"st","t":"Nurse exits.","key":"s9"},{"k":"sp","t":"Juliet"},{"k":"ln","n":10,"t":"Then, window, let day in, and let life out.","g":"Then let the daylight in through the window — and let my happiness leave with Romeo."},{"k":"sp","t":"Romeo"},{"k":"ln","n":11,"t":"Farewell, farewell. One kiss and I'll descend.","g":"Goodbye, goodbye — one more kiss, then I'll climb down."},{"k":"st","t":"Romeo descends from the window.","key":"s11"},{"k":"sp","t":"Juliet"},{"k":"ln","n":12,"t":"Art thou gone so? Love, lord, ay husband, friend!\nI must hear from thee every day in the hour,\nFor in a minute there are many days.\nO, by this count I shall be much in years\nEre I again behold my Romeo.","g":"Are you really leaving already, my love, my lord, my husband, my friend? I need to hear from you constantly — every minute apart will feel like days, so by the time we meet again I'll feel like I've aged years."},{"k":"sp","t":"Romeo"},{"k":"ln","n":13,"t":"Farewell.\nI will omit no opportunity\nThat may convey my greetings, love, to thee.","g":"Goodbye. I'll take every chance I get to send word to you."},{"k":"sp","t":"Juliet"},{"k":"ln","n":14,"t":"O, think'st thou we shall ever meet again?","g":"Do you think we'll ever see each other again?"},{"k":"sp","t":"Romeo"},{"k":"ln","n":15,"t":"I doubt it not; and all these woes shall serve\nFor sweet discourses in our times to come.","g":"I'm sure we will — and one day all this suffering will just be something we look back on and talk about together."},{"k":"sp","t":"Juliet"},{"k":"ln","n":16,"t":"O God, I have an ill-divining soul!\nMethinks I see thee, now thou art so low,\nAs one dead in the bottom of a tomb.\nEither my eyesight fails or thou lookest pale.","g":"I have a terrible, sinking feeling. Now that you're down there below me, I suddenly picture you as if you were dead at the bottom of a tomb. Either my eyes are playing tricks on me, or you really do look pale."},{"k":"sp","t":"Romeo"},{"k":"ln","n":17,"t":"And trust me, love, in my eye so do you.\nDry sorrow drinks our blood. Adieu, adieu.","g":"Believe me, you look pale to me too — sadness seems to be draining the colour from both of us. Goodbye, goodbye."},{"k":"st","t":"Romeo exits.","key":"s17"},{"k":"sp","t":"Juliet"},{"k":"ln","n":18,"t":"O Fortune, Fortune, all men call thee fickle.\nIf thou art fickle, what dost thou with him\nThat is renowned for faith? Be fickle, Fortune,\nFor then I hope thou wilt not keep him long,\nBut send him back.","g":"Fortune, everyone says you're unpredictable and change your mind all the time — so if that's true, please don't keep hold of Romeo for long. Be fickle, and send him back to me soon."}],"notes":[{"id":"n4-1","from":1,"to":5,"title":"Arguing against the truth","meaning":"Juliet insists the birdsong is a nightingale (a night bird), not a lark (which sings at dawn) — trying to argue the sun hasn't actually risen.","effect":"This extended debate over something so small (which bird is singing) captures how desperately she is trying to control time itself through sheer argument, even though she already senses she's wrong.","ask":"Why does Shakespeare draw this argument out over several lines, instead of Romeo just leaving immediately?","tags":["love","language"]},{"id":"n4-2","at":6,"phrase":"More light and light, more dark and dark our woes.","title":"Antithesis","meaning":"Romeo places two opposites directly against each other: light increasing exactly as their happiness decreases.","effect":"This tight, balanced structure makes the connection between dawn and disaster feel mechanical and inescapable — as if one is causing the other.","ask":"Can you find another moment in the play where light and dark are linked to happiness and disaster?","tags":["language"],"support":"Romeo contrasts '___' with '___.' This technique is called ___, and it shows ___.","revise":true},{"id":"n4-3","from":12,"to":17,"title":"Naming him four times","meaning":"Juliet calls Romeo 'love, lord, ay, husband, friend' all in one line, as if trying to hold on to every version of their relationship at once.","effect":"The list-like repetition shows her grasping for connection in the last moments before separation — as though naming enough roles might keep him from actually leaving.","tags":["love","language"]},{"id":"n4-4","at":16,"phrase":"Methinks I see thee, now thou art so low,\nAs one dead in the bottom of a tomb.","title":"A premonition of the ending","meaning":"Juliet has a sudden, unexplained vision of Romeo as a corpse in a tomb — long before either of them dies.","effect":"This is one of the clearest pieces of foreshadowing in the whole play. The audience, who already suspects tragedy from the Prologue, sees Juliet's own imagination reaching toward the ending Shakespeare has already promised.","ask":"Why give a character an accurate premonition of their own tragedy, instead of keeping the audience the only ones who know?","tags":["fate","ahead"],"support":"Juliet imagines Romeo as ___. This foreshadows ___ because ___.","stretch":"By Act 5, this image becomes literally true. Track how many other 'accidental prophecies' characters make across the play, and consider what this pattern suggests about fate versus coincidence.","revise":true}]},{"type":"link","key":"l3","short":"Lady Capulet arrives","mins":2,"title":"Lady Capulet arrives","text":"Moments after Romeo disappears from sight, Juliet hears her {{mother}} approaching. Lady Capulet finds her daughter in tears and assumes she is still grieving for {{Tybalt}}. She reveals a plan to have someone in {{Mantua}} secretly poison Romeo — completely unaware that the man she wants dead is Juliet's own {{husband}}.","ext":"What kind of wordplay could Juliet use here to express her real feelings without her mother noticing?"},{"type":"extract","key":"e5","short":"3.5 A dangerous pun","mins":15,"label":"Extract 3","title":"Act 3, Scene 5: ‘Till I behold him—dead—’","sub":"Juliet must hide her true feelings from her own mother, then learns she is to marry Paris in days.","setup":"Lady Capulet believes Juliet's grief is for Tybalt, and that she wants Romeo dead as revenge.","task":"Underline the line where Juliet's words could mean two completely different things depending on how you read them.","scene":"3.5","lines":[{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":19,"t":"Ho, daughter, are you up?","g":"Daughter, are you awake?"},{"k":"sp","t":"Juliet"},{"k":"ln","n":20,"t":"Who is 't that calls? It is my lady mother.\nIs she not down so late or up so early?\nWhat unaccustomed cause procures her hither?","g":"Who's calling me? Oh — it's my mother. Why is she up so early, or still up so late? Something unusual must have brought her here."},{"k":"st","t":"Juliet descends.","key":"s20"},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":21,"t":"Why, how now, Juliet?","g":"What's wrong, Juliet?"},{"k":"sp","t":"Juliet"},{"k":"ln","n":22,"t":"Madam, I am not well.","g":"Mother, I'm not feeling well."},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":23,"t":"Evermore weeping for your cousin's death?\nWhat, wilt thou wash him from his grave with tears?\nAn if thou couldst, thou couldst not make him live.\nTherefore have done. Some grief shows much of love,\nBut much of grief shows still some want of wit.","g":"Still crying over Tybalt's death? Even if you cried enough tears to wash him out of his grave, you still couldn't bring him back to life. So stop now — a bit of grief shows love, but this much crying just seems excessive."},{"k":"sp","t":"Juliet"},{"k":"ln","n":24,"t":"Yet let me weep for such a feeling loss.","g":"Please let me keep crying anyway — this loss really does hurt."},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":25,"t":"So shall you feel the loss, but not the friend\nWhich you weep for.","g":"Then you'll go on feeling the pain of losing him, but your crying won't bring your friend back."},{"k":"sp","t":"Juliet"},{"k":"ln","n":26,"t":"Feeling so the loss,\nI cannot choose but ever weep the friend.","g":"Because I feel the loss so strongly, I can't help but keep crying for him."},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":27,"t":"Well, girl, thou weep'st not so much for his death\nAs that the villain lives which slaughtered him.","g":"Actually, I don't think you're crying so much about his death as about the fact that the villain who killed him is still alive."},{"k":"sp","t":"Juliet"},{"k":"ln","n":28,"t":"What villain, madam?","g":"Which villain do you mean?"},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":29,"t":"That same villain, Romeo.","g":"Romeo — that villain."},{"k":"sp","t":"Juliet"},{"k":"ln","n":30,"t":"[aside] Villain and he be many miles asunder.—\nGod pardon him. I do with all my heart,\nAnd yet no man like he doth grieve my heart.","g":"[to herself] Romeo is nothing like a villain, really. [to her mother] God forgive him — I do, with all my heart. And yet no one's fate upsets my heart the way his does."},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":31,"t":"That is because the traitor murderer lives.","g":"That's because the murdering traitor is still alive."},{"k":"sp","t":"Juliet"},{"k":"ln","n":32,"t":"Ay, madam, from the reach of these my hands.\nWould none but I might venge my cousin's death!","g":"Yes — alive and out of my own hands' reach. I wish I alone could take revenge for my cousin's death!"},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":33,"t":"We will have vengeance for it, fear thou not.\nThen weep no more. I'll send to one in Mantua,\nWhere that same banished runagate doth live,\nShall give him such an unaccustomed dram\nThat he shall soon keep Tybalt company.\nAnd then, I hope, thou wilt be satisfied.","g":"Don't worry, we'll get our revenge — so stop crying. I'll arrange for someone in Mantua, where he's living in exile, to secretly poison him, so he joins Tybalt in death. Then I hope you'll finally feel better."},{"k":"sp","t":"Juliet"},{"k":"ln","n":34,"t":"Indeed, I never shall be satisfied\nWith Romeo till I behold him—dead—\nIs my poor heart, so for a kinsman vexed.\nMadam, if you could find out but a man\nTo bear a poison, I would temper it,\nThat Romeo should, upon receipt thereof,\nSoon sleep in quiet. O, how my heart abhors\nTo hear him named and cannot come to him\nTo wreak the love I bore my cousin\nUpon his body that hath slaughtered him.","g":"I really won't feel satisfied about Romeo until I see him — dead — is how upset my poor heart is over my cousin. Mother, if you could find a man to carry a poison, I would mix it myself, so that as soon as Romeo received it he would fall peacefully asleep forever. It upsets me so much just to hear his name and not be able to reach him myself to avenge my cousin."},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":35,"t":"Find thou the means, and I'll find such a man.\nBut now I'll tell thee joyful tidings, girl.","g":"You find the poison, I'll find the man. But now, I have happy news for you."},{"k":"sp","t":"Juliet"},{"k":"ln","n":36,"t":"And joy comes well in such a needy time.\nWhat are they, beseech your Ladyship?","g":"Good — I could use some happy news right now. What is it, please?"},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":37,"t":"Well, well, thou hast a careful father, child,\nOne who, to put thee from thy heaviness,\nHath sorted out a sudden day of joy\nThat thou expects not, nor I looked not for.","g":"Well, you have such a caring father — to lift you out of your sadness, he's arranged a sudden happy occasion you weren't expecting at all, and neither was I."},{"k":"sp","t":"Juliet"},{"k":"ln","n":38,"t":"Madam, in happy time! What day is that?","g":"What good timing! What is it?"},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":39,"t":"Marry, my child, early next Thursday morn\nThe gallant, young, and noble gentleman,\nThe County Paris, at Saint Peter's Church\nShall happily make thee there a joyful bride.","g":"Well, my child, early next Thursday morning the wonderful young nobleman Paris will happily marry you at Saint Peter's Church."},{"k":"sp","t":"Juliet"},{"k":"ln","n":40,"t":"Now, by Saint Peter's Church, and Peter too,\nHe shall not make me there a joyful bride!\nI wonder at this haste, that I must wed\nEre he that should be husband comes to woo.\nI pray you, tell my lord and father, madam,\nI will not marry yet, and when I do I swear\nIt shall be Romeo, whom you know I hate,\nRather than Paris. These are news indeed!","g":"I swear, by that very church, he will NOT marry me there! I'm shocked at the rush — I'm being married off before the groom has even properly courted me. Please tell my father I won't marry yet — and when I do, I swear it will be Romeo, who you think I hate, rather than Paris. What news indeed!"}],"notes":[{"id":"n5-1","from":23,"to":23,"title":"Misreading grief","meaning":"Lady Capulet believes Juliet is crying only for Tybalt, and even suggests too much grief shows 'want of wit' (a lack of sense).","effect":"This misunderstanding sets up everything that follows — the whole conversation is built on a false assumption the audience can see through immediately.","tags":["irony","family"]},{"id":"n5-2","from":30,"to":34,"title":"Speaking in two languages at once","meaning":"Juliet's lines are all technically true, but mean the opposite of what her mother hears: she truly grieves 'no man' the way she grieves Romeo's banishment (meaning: she loves him), and she won't be 'satisfied' until she sees him — meaning reunited, not dead.","effect":"This sustained ambiguity lets Juliet speak two truths simultaneously: an outward performance of hatred and an inward declaration of love, without ever technically lying.","ask":"Why might Shakespeare want Juliet to deceive her mother through technically true words, rather than an outright lie?","tags":["language","appearance","irony"],"support":"When Juliet says '___,' her mother understands it to mean ___, but Juliet secretly means ___.","stretch":"This kind of double meaning is called equivocation. Research how this same technique is used to different effect in another Shakespeare play you know, or compare it to Romeo's own wordplay with Tybalt in 3.1.","revise":true},{"id":"n5-3","at":34,"phrase":"till I behold him—dead—","title":"A single dash changes everything","meaning":"Read one way (with the dash as a pause before a shocking word), this sounds like Juliet wants Romeo dead. Read another way, 'dead' could describe her own heart — vexed 'dead' with grief — while she simply wants to see him again.","effect":"The punctuation itself becomes part of the performance: an actor playing Juliet has to decide how much horror or love to let slip through in that pause, and the line works differently depending on the choice.","tags":["language","appearance"]},{"id":"n5-3b","at":34,"phrase":"Madam, if you could find out but a man\nTo bear a poison, I would temper it,","title":"Playing the request as revenge","meaning":"Juliet asks her mother for help finding a poison — sustaining the 'revenge' performance so convincingly that she names a method.","effect":"It's a risky improvisation: she has to keep the lie going in specific, credible detail, immediately after the ambiguous 'dead' line.","tags":["language","appearance"]},{"id":"n5-4","from":40,"to":40,"title":"Refusal, and a hidden truth in plain sight","meaning":"Juliet swears she will only ever marry Romeo — technically true, since she already has — while her mother hears only a strange, dramatic refusal.","effect":"Juliet is, for the only time in the scene, telling the literal truth out loud, and it is so unthinkable to Lady Capulet that it isn't even considered as a real possibility.","ask":"Why might the most honest line in the scene be the one nobody believes?","tags":["irony","love"]}]},{"type":"practice","key":"h2-practice","short":"Practice","mins":8,"title":"Quick practice: 3.4 and the start of 3.5","sub":"Write your answers first. Then tap a question to check.","tipsTitle":"What earns marks","tips":[{"h":"1-mark plot questions","t":"One clear, short answer — don't overwrite."},{"h":"3-mark analysis questions","t":"Quote it, explain it in your own words, then analyse the effect or technique. One mark per part."}],"qs":[{"k":"short","n":1,"marks":1,"q":"What day does Capulet decide Juliet will marry Paris?","a":"Thursday."},{"k":"short","n":2,"marks":1,"q":"Why does Capulet want a small, quiet wedding rather than a big celebration?","a":"Because Tybalt has only just died, and celebrating loudly would look disrespectful so soon after his death."},{"k":"short","n":3,"marks":1,"q":"Which bird does Juliet claim they're hearing, to convince Romeo it's still night?","a":"The nightingale (a night bird), not the lark (a dawn bird)."},{"k":"short","n":4,"marks":1,"q":"What does Lady Capulet initially believe Juliet is upset about?","a":"Tybalt's death."},{"k":"short","n":5,"marks":3,"starter":"Capulet says '___,' which shows he assumes ___. This is dramatic irony because ___.","q":"Quote Capulet's confident claim in Scene 3.4 that Juliet will obey him, and explain why this is a powerful example of dramatic irony.","a":"“I think she will be ruled / In all respects by me.” This shows he assumes Juliet has no will of her own and will simply obey. It is dramatic irony because the audience already knows Juliet is secretly married to Romeo, so his total confidence is about to be proved completely wrong."},{"k":"short","n":6,"marks":3,"starter":"When Romeo says '___,' he is using antithesis to contrast ___ with ___. This shows ___.","q":"Quote Romeo's line about light and dark near the start of the dawn scene, name the technique, and analyse what it shows about the connection between the setting and the couple's happiness.","a":"“More light and light—more dark and dark our woes.” This is antithesis, contrasting increasing daylight with increasing sorrow. It shows how tightly their happiness is tied to darkness and secrecy — daylight itself becomes their enemy."}]},{"type":"plenary","key":"h2-end","short":"Exit","mins":4,"title":"Exit ticket","ticket":[{"lvl":"core","q":"Why does Capulet suddenly decide on Thursday for the wedding, after first suggesting Wednesday?","a":"He worries Wednesday is too soon after Tybalt's death, but still wants the marriage to happen quickly — Thursday lets him keep the wedding small and quiet without seeming to rush too obviously."},{"lvl":"core","q":"Why does Juliet argue that the birdsong is a nightingale rather than a lark?","a":"She is desperately trying to delay Romeo's departure by pretending it is still night."},{"lvl":"stretch","q":"Explain how Scene 3.4 is a powerful example of dramatic irony. Use a quotation.","a":"Capulet says he is certain Juliet 'will be ruled / In all respects by me' — but the audience already knows she is secretly married to Romeo, so his confidence is about to be proved completely wrong. The gap between what Capulet believes and what the audience knows is what makes it dramatic irony."}],"next":"Next lesson: Capulet's fury explodes when Juliet refuses the marriage, and the Nurse gives her devastating advice."}]},{"title":"Lesson 3","subtitle":"Act 3, Scene 5: Capulet's fury and Juliet's abandonment","aims":{"li":"To understand how Capulet's fury exposes the true, conditional nature of his love for Juliet, and how the Nurse's betrayal leaves Juliet completely alone.","sc":["I can explain how Capulet's language changes once Juliet refuses him, using a quotation.","I can explain why the Nurse's advice feels like a betrayal, using a quotation.","I can explain what Juliet's closing lines suggest about what she might do next."],"stretch":"I can compare Capulet's attitude to Juliet at the start of the play with his attitude in this scene, and explain what has really changed.","word":{"w":"hyperbole","m":"extreme exaggeration, not meant to be taken literally.","eg":"Capulet's fury is expressed almost entirely through hyperbole — threats and insults far bigger than the situation strictly requires. Use the word in one sentence today."},"bridge":"Last time: Capulet arranged Juliet's marriage to Paris for Thursday, completely unaware she is already secretly married to Romeo; then Romeo and Juliet parted at dawn, and Juliet hid her true feelings from her mother using a dangerous pun."},"steps":[{"type":"aims","key":"h3-aims","short":"Aims","mins":4,"title":"Today's lesson","doNow":{"title":"Do now: predict","qa":[{"q":"Capulet doesn't yet know Juliet is refusing Paris because she's already married. From his point of view, what will her refusal look like?","a":"Pure, unexplained disobedience — which is likely to make him angrier than if he understood the real reason."},{"q":"In Act 1, Capulet told Paris Juliet was too young to marry and that her consent mattered ('my will to her consent is but a part'). Do you expect that attitude to survive this scene?","a":"No right answer yet — but it's worth watching whether his early gentleness holds up under pressure."},{"q":"The Nurse has helped Juliet marry Romeo in secret. Do you expect her to stay loyal to that secret under pressure, or side with Juliet's parents?","a":"No right answer yet — but it's worth watching whether her loyalty holds once the family pushes back."}]}},{"type":"extract","key":"e6","short":"3.5 Capulet's rage begins","mins":12,"label":"Extract 1","title":"Act 3, Scene 5: ‘I would the fool were married to her grave!’","sub":"Capulet arrives expecting good news. Juliet's refusal changes his tone instantly.","setup":"Capulet enters, eager to hear that Juliet has accepted the marriage.","task":"Underline every insult Capulet uses against Juliet in this extract.","scene":"3.5","lines":[{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":41,"t":"Here comes your father. Tell him so yourself,\nAnd see how he will take it at your hands.","g":"Lady Capulet tells Juliet to explain her refusal to her father herself, and see how he reacts."},{"k":"st","t":"Enter Capulet and Nurse.","key":"s41"},{"k":"sp","t":"Capulet"},{"k":"ln","n":42,"t":"When the sun sets, the earth doth drizzle dew,\nBut for the sunset of my brother's son\nIt rains downright.\nHow now, a conduit, girl? What, still in tears?\nEvermore show'ring? In one little body\nThou counterfeits a bark, a sea, a wind.\nFor still thy eyes, which I may call the sea,\nDo ebb and flow with tears; the bark thy body is,\nSailing in this salt flood; the winds thy sighs,\nWho, raging with thy tears and they with them,\nWithout a sudden calm, will overset\nThy tempest-tossèd body.","g":"Capulet arrives making an elaborate, almost poetic comparison: Juliet's crying body is like a ship caught in a storm — her eyes the sea, her body the ship, her sighs the wind — warning that without calming down she'll capsize herself."},{"k":"ln","n":43,"t":"How now, wife?\nHave you delivered to her our decree?","g":"He turns to his wife and asks if she's told Juliet about the marriage decision yet."},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":44,"t":"Ay, sir; but she will none, she gives you thanks.\nI would the fool were married to her grave!","g":"Yes, she says — but Juliet wants nothing to do with it, though she thanks him for the thought. Lady Capulet angrily wishes Juliet were married to her own grave instead."},{"k":"sp","t":"Capulet"},{"k":"ln","n":45,"t":"Soft, take me with you, take me with you, wife.\nHow, will she none? Doth she not give us thanks?\nIs she not proud? Doth she not count her blessed,\nUnworthy as she is, that we have wrought\nSo worthy a gentleman to be her bride?","g":"Wait, slow down — explain that properly. She won't accept? Doesn't she feel thankful? Isn't she proud that they've arranged such a worthy husband for her, unworthy as she is?"},{"k":"sp","t":"Juliet"},{"k":"ln","n":46,"t":"Not proud, you have; but thankful, that you have.\nProud can I never be of what I hate,\nBut thankful even for hate that is meant love.","g":"Juliet carefully replies: she isn't proud of something she hates, but she is thankful that they meant it out of love, even though it feels like hate to her."},{"k":"sp","t":"Capulet"},{"k":"ln","n":47,"t":"How, how, how, how? Chopped logic? What is this?\n“Proud,” and “I thank you,” and “I thank you not,”\nAnd yet “not proud”? Mistress minion you,\nThank me no thankings, nor proud me no prouds,\nBut fettle your fine joints ’gainst Thursday next\nTo go with Paris to Saint Peter's Church,\nOr I will drag thee on a hurdle thither.\nOut, you green-sickness carrion! Out, you baggage!\nYou tallow face!","g":"Capulet explodes, mocking her careful wording as clever trickery. He orders her to get ready for the Thursday wedding or be dragged there by force, and hurls a string of insults at her — calling her a sickly corpse, baggage, and pale-faced."}],"notes":[{"id":"n6-0","from":42,"to":42,"title":"An extended metaphor: Juliet as a ship in a storm","meaning":"Capulet compares Juliet's crying body to a ship: her eyes are the sea, her body the boat, her sighs the wind — all threatening to 'overset' (capsize) her.","effect":"It sounds tender at first, even poetic — but it's also Capulet performing his own eloquence, building to the same question either way: why hasn't she said yes?","ask":"Does this elaborate metaphor make Capulet seem caring, or self-important?","tags":["language","family"]},{"id":"n6-1","at":44,"phrase":"I would the fool were married to her grave!","title":"A curse that comes true","meaning":"Lady Capulet's angry, exaggerated wish — that Juliet were married to death itself instead of Paris — is meant as pure hyperbole.","effect":"This is dramatic irony at its most chilling: Juliet will indeed be 'married' to a tomb before the play ends, in a way nobody in this scene could imagine.","ask":"Why might Shakespeare put such an accurate prediction in the mouth of a character who means it as nothing more than an insult?","tags":["irony","fate"],"support":"Lady Capulet's line is meant as ___, but by the end of the play it becomes ___.","stretch":"Compare this unconscious prophecy to Juliet's own vision of Romeo 'dead in the bottom of a tomb' earlier in this scene. What does the pattern suggest about how fate operates in this play?","revise":true},{"id":"n6-2","from":45,"to":45,"title":"Capulet's certainty, still intact","meaning":"Capulet assumes any hesitation must be about worthiness — that Juliet should feel lucky, not that she might have a real reason to refuse.","effect":"His confidence that he understands the situation makes the coming explosion feel even more disproportionate — he has no framework for a daughter simply saying no.","tags":["family","conflict"]},{"id":"n6-3","at":47,"phrase":"Chopped logic?","title":"Dismissing her reasoning as wordplay","meaning":"Capulet accuses Juliet of twisting language cleverly ('chopped logic') rather than actually engaging with what she's said.","effect":"This is ironic, since Juliet has just used careful, precise language (much like her earlier 'dead' pun) — and it's dismissed instantly the moment it doesn't serve her father's plan.","tags":["language","conflict"]},{"id":"n6-4","at":47,"phrase":"green-sickness carrion","title":"Insults that dehumanise","meaning":"Capulet calls Juliet a pale, sickly corpse ('carrion') and other degrading names within seconds of her single act of defiance.","effect":"The speed and violence of this escalation — from doting father to this — shows how conditional his affection has been on her obedience the whole time.","ask":"Compare this to how Capulet described Juliet in Act 1 ('the hopeful lady of my earth'). What has really changed?","tags":["family","conflict"],"support":"Capulet calls Juliet '___,' which means ___. This is a huge shift from ___ earlier in the play.","revise":true}]},{"type":"extract","key":"e7","short":"3.5 Fury and abandonment","mins":17,"label":"Extract 2","title":"Act 3, Scene 5: ‘My fingers itch’","sub":"Capulet's rage peaks, Lady Capulet refuses to help, and the Nurse gives Juliet advice that breaks her trust completely.","setup":"Juliet tries to reason with her father. It only makes things worse.","task":"Underline the line that suggests Capulet is close to physically striking Juliet.","scene":"3.5","lines":[{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":48,"t":"Fie, fie, what, are you mad?","g":"Lady Capulet is shocked — she asks if Juliet has lost her mind."},{"k":"sp","t":"Juliet"},{"k":"ln","n":49,"t":"Good father, I beseech you on my knees,\nHear me with patience but to speak a word.","g":"Juliet begs, on her knees, for her father to just listen to her for one moment."},{"k":"sp","t":"Capulet"},{"k":"ln","n":50,"t":"Hang thee, young baggage, disobedient wretch!\nI tell thee what: get thee to church o' Thursday,\nOr never after look me in the face.\nSpeak not; reply not; do not answer me.\nMy fingers itch.—Wife, we scarce thought us blessed\nThat God had lent us but this only child,\nBut now I see this one is one too much,\nAnd that we have a curse in having her.\nOut on her, hilding.","g":"Capulet explodes further: get to church on Thursday or never look him in the face again. Don't speak, don't answer — his fingers are itching, meaning he's close to striking her. He says having only one child once felt like a blessing, but now feels like a curse."},{"k":"sp","t":"Nurse"},{"k":"ln","n":51,"t":"God in heaven bless her!\nYou are to blame, my lord, to rate her so.","g":"The Nurse speaks up in Juliet's defence, telling Capulet he's wrong to scold her so harshly."},{"k":"sp","t":"Capulet"},{"k":"ln","n":52,"t":"And why, my Lady Wisdom? Hold your tongue.\nGood Prudence, smatter with your gossips, go.","g":"Capulet mocks the Nurse sarcastically — calling her 'Lady Wisdom' and 'Good Prudence' — and tells her to go gossip with her friends instead."},{"k":"sp","t":"Nurse"},{"k":"ln","n":53,"t":"I speak no treason.","g":"The Nurse insists she's said nothing wrong."},{"k":"sp","t":"Capulet"},{"k":"ln","n":54,"t":"O, God ’i’ g’ eden!","g":"Capulet dismisses her with an exasperated, sarcastic exclamation — roughly 'Good day to you, then!'"},{"k":"sp","t":"Nurse"},{"k":"ln","n":55,"t":"May not one speak?","g":"The Nurse asks if she's not even allowed to speak."},{"k":"sp","t":"Capulet"},{"k":"ln","n":56,"t":"Peace, you mumbling fool!\nUtter your gravity o'er a gossip's bowl,\nFor here we need it not.","g":"Capulet tells her to be quiet — save her wisdom for her gossiping friends, since nobody needs it here."},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":57,"t":"You are too hot.","g":"Even Lady Capulet tells him he's overreacting."},{"k":"sp","t":"Capulet"},{"k":"ln","n":58,"t":"God's bread, it makes me mad.\nDay, night, hour, tide, time, work, play,\nAlone, in company, still my care hath been\nTo have her matched. And having now provided\nA gentleman of noble parentage,\nOf fair demesnes, youthful, and nobly ligned,\nStuffed, as they say, with honorable parts,\nProportioned as one's thought would wish a man—\nAnd then to have a wretched puling fool,\nA whining mammet, in her fortune's tender,\nTo answer “I'll not wed. I cannot love.\nI am too young. I pray you, pardon me.”\nBut, an you will not wed, I'll pardon you!\nGraze where you will, you shall not house with me.\nLook to 't; think on 't. I do not use to jest.\nThursday is near. Lay hand on heart; advise.\nAn you be mine, I'll give you to my friend.\nAn you be not, hang, beg, starve, die in the streets,\nFor, by my soul, I'll ne'er acknowledge thee,\nNor what is mine shall never do thee good.\nTrust to 't; bethink you. I'll not be forsworn.","g":"Capulet rages on: he's spent his whole life focused on finding Juliet a good match, and now that he's found a perfect gentleman, she whines that she won't marry, that she's too young. If she won't marry Paris, he's finished with her — she can starve or beg in the streets for all he cares, because he'll never claim her as his own again. He means every word."},{"k":"st","t":"He exits.","key":"s58"},{"k":"sp","t":"Juliet"},{"k":"ln","n":59,"t":"Is there no pity sitting in the clouds\nThat sees into the bottom of my grief?—\nO sweet my mother, cast me not away.\nDelay this marriage for a month, a week,\nOr, if you do not, make the bridal bed\nIn that dim monument where Tybalt lies.","g":"Juliet begs the heavens for pity, then pleads with her mother not to abandon her — asking her to delay the wedding by even a month or a week, or else make her wedding bed in Tybalt's tomb instead."},{"k":"sp","t":"Lady Capulet"},{"k":"ln","n":60,"t":"Talk not to me, for I'll not speak a word.\nDo as thou wilt, for I have done with thee.","g":"Lady Capulet coldly refuses to say another word to her and washes her hands of the whole situation."},{"k":"st","t":"She exits.","key":"s60"},{"k":"sp","t":"Juliet"},{"k":"ln","n":61,"t":"O God! O nurse, how shall this be prevented?\nMy husband is on Earth, my faith in heaven.\nHow shall that faith return again to Earth\nUnless that husband send it me from heaven\nBy leaving Earth? Comfort me; counsel me.—\nAlack, alack, that heaven should practice stratagems\nUpon so soft a subject as myself.—\nWhat sayst thou? Hast thou not a word of joy?\nSome comfort, nurse.","g":"Juliet turns to the Nurse in despair: her husband is alive on Earth but she can't reach him, so how can this marriage possibly be stopped? She begs the Nurse for any word of comfort."},{"k":"sp","t":"Nurse"},{"k":"ln","n":62,"t":"Faith, here it is.\nRomeo is banished, and all the world to nothing\nThat he dares ne'er come back to challenge you,\nOr, if he do, it needs must be by stealth.\nThen, since the case so stands as now it doth,\nI think it best you married with the County.\nO, he's a lovely gentleman!\nRomeo's a dishclout to him. An eagle, madam,\nHath not so green, so quick, so fair an eye\nAs Paris hath. Beshrew my very heart,\nI think you are happy in this second match,\nFor it excels your first, or, if it did not,\nYour first is dead, or ’twere as good he were,\nAs living here and you no use of him.","g":"The Nurse's advice: since Romeo is banished and can probably never safely return, Juliet should just marry Paris instead — he's a far better match, she says, calling Romeo a 'dishcloth' by comparison. Even if he weren't better, Romeo might as well be dead since Juliet can't be with him anyway."},{"k":"sp","t":"Juliet"},{"k":"ln","n":63,"t":"Speak'st thou from thy heart?","g":"Juliet asks if the Nurse really means that."},{"k":"sp","t":"Nurse"},{"k":"ln","n":64,"t":"And from my soul too, else beshrew them both.","g":"The Nurse swears she means it completely."},{"k":"sp","t":"Juliet"},{"k":"ln","n":65,"t":"Amen.","g":"Juliet simply replies, 'Amen' — coldly closing the conversation."},{"k":"sp","t":"Nurse"},{"k":"ln","n":66,"t":"What?","g":"The Nurse, confused by her tone, asks what she means."},{"k":"sp","t":"Juliet"},{"k":"ln","n":67,"t":"Well, thou hast comforted me marvelous much.\nGo in and tell my lady I am gone,\nHaving displeased my father, to Lawrence' cell\nTo make confession and to be absolved.","g":"Juliet says, with heavy irony, that the Nurse has 'comforted' her enormously. She tells her to tell her mother she's gone to Friar Lawrence to confess her sins — not mentioning the real reason."},{"k":"sp","t":"Nurse"},{"k":"ln","n":68,"t":"Marry, I will; and this is wisely done.","g":"The Nurse, missing the sarcasm completely, agrees this is a wise plan and leaves."},{"k":"st","t":"She exits.","key":"s68"},{"k":"sp","t":"Juliet"},{"k":"ln","n":69,"t":"Ancient damnation, O most wicked fiend!\nIs it more sin to wish me thus forsworn\nOr to dispraise my lord with that same tongue\nWhich she hath praised him with above compare\nSo many thousand times? Go, counselor.\nThou and my bosom henceforth shall be twain.\nI'll to the Friar to know his remedy.\nIf all else fail, myself have power to die.","g":"Alone, Juliet condemns the Nurse as a wicked old traitor — asking whether it's worse to break her wedding vow, or to insult the husband the Nurse has praised so many times before. She decides the Nurse is no longer someone she can trust, and resolves to go to the Friar for help. If nothing else works, she says, she still has the power to end her own life."},{"k":"st","t":"She exits.","key":"s69"}],"notes":[{"id":"n7-1","at":50,"phrase":"My fingers itch.","title":"A barely restrained threat","meaning":"Capulet's fingers 'itch' — a physical urge, implying he wants to strike Juliet and is only just holding back.","effect":"This tiny, physical detail is more disturbing than any of his insults: it shows the family's authority over Juliet has a genuine threat of violence sitting just beneath the surface.","ask":"How does this moment change how we see Capulet compared to his protectiveness of Juliet in Act 1?","tags":["family","conflict"],"support":"Capulet's fingers '___' shows that he ___. This is disturbing because ___.","stretch":"Consider the phrase 'we have a curse in having her.' What does it suggest about how conditional a daughter's worth was on her obedience, in this context?","revise":true},{"id":"n7-1b","from":51,"to":56,"title":"The Nurse tries, briefly","meaning":"The Nurse speaks up for Juliet ('You are to blame, my lord, to rate her so'), but Capulet shuts her down instantly with mocking names — 'Lady Wisdom,' 'Good Prudence,' 'mumbling fool.'","effect":"This makes the Nurse's later advice to marry Paris even more of a betrayal: here, at least, she was still on Juliet's side.","tags":["family","conflict"]},{"id":"n7-1c","at":58,"phrase":"An you be not, hang, beg, starve, die in the streets,","title":"The full extent of the threat","meaning":"Capulet lists exactly what will happen if Juliet doesn't obey: he'll disown her completely, leaving her to starve or beg.","effect":"This long, escalating rant — building from a list of everything he's provided to this final threat — shows how total a father's legal and financial power over a daughter really was.","ask":"What does it show about Capulet that his 'care' for Juliet turns into a threat to abandon her the moment she disobeys?","tags":["family","conflict"],"support":"Capulet threatens that if Juliet refuses, she will ___. This shows that his care for her was always conditional on ___.","revise":true},{"id":"n7-1d","from":59,"to":60,"title":"Abandoned by both parents","meaning":"Juliet begs her mother directly for mercy — even suggesting she'd rather die than marry Paris — and Lady Capulet coldly refuses to even speak to her.","effect":"This is easy to overlook next to Capulet's rage, but it matters just as much: Juliet loses her mother's support here too, moments before the Nurse's betrayal completes her isolation.","tags":["family"]},{"id":"n7-2","from":62,"to":62,"title":"The Nurse's betrayal","meaning":"The Nurse — who has been Juliet's closest confidante and helped arrange her secret marriage — now advises her to simply marry Paris instead, calling Romeo 'a dishclout' by comparison.","effect":"This is the moment Juliet loses her last ally. The one adult who knew the truth and supported her now abandons that truth entirely for practical convenience.","ask":"Why might this betrayal hurt Juliet more than her parents' anger?","tags":["family","love"],"support":"The Nurse advises Juliet to ___, even though she knows ___. This matters because ___.","revise":true},{"id":"n7-3","from":63,"to":65,"title":"A very short, very cold reply","meaning":"Juliet's only response to the Nurse's advice is two single words: 'Speak'st thou from thy heart?' and, after confirmation, 'Amen.'","effect":"The brevity says everything — Juliet has nothing more to say to someone who has just shown her true loyalty. Her warmth toward the Nurse is visibly gone.","tags":["love","language"]},{"id":"n7-4","at":69,"phrase":"If all else fail, myself have power to die.","title":"The first mention of suicide as an option","meaning":"Juliet ends the scene by naming death as her last resort if the Friar cannot help her.","effect":"This is a major turning point and a direct foreshadowing of the play's ending — the audience now knows exactly what Juliet is capable of if she runs out of options.","ask":"How does this line change the stakes of everything that happens from here on?","tags":["fate","ahead"],"support":"Juliet says her last resort is ___. This foreshadows ___.","stretch":"This is Juliet's first spoken reference to her own death as a choice, not something that simply happens to her. Track how this idea of death as agency develops across Acts 4 and 5.","revise":true}]},{"type":"practice","key":"h3-practice","short":"Practice","mins":8,"title":"Quick practice: Capulet's fury","sub":"Write your answers first. Then tap a question to check.","tipsTitle":"What earns marks","tips":[{"h":"1-mark plot questions","t":"One clear, short answer — don't overwrite."},{"h":"3-mark analysis questions","t":"Quote it, explain it in your own words, then analyse the effect or technique. One mark per part."}],"qs":[{"k":"short","n":1,"marks":1,"q":"What advice does the Nurse give Juliet after Capulet's outburst?","a":"To marry Paris instead, since Romeo is banished and Paris is the better match."},{"k":"short","n":2,"marks":1,"q":"What does Capulet threaten to do if Juliet refuses to marry Paris?","a":"Disown her completely — cast her out to starve or beg in the streets."},{"k":"short","n":3,"marks":1,"q":"Besides Capulet, who else refuses to support Juliet in this extract?","a":"Both Lady Capulet and, ultimately, the Nurse."},{"k":"short","n":4,"marks":1,"q":"Where does Juliet decide to go for help at the end of the scene?","a":"To Friar Lawrence's cell."},{"k":"short","n":5,"marks":3,"starter":"Capulet's language shifts from ___ to ___ once Juliet refuses him. This reveals ___.","q":"Choose one insult Capulet uses against Juliet, quote it, explain its literal meaning, and analyse what this shift in his language reveals about his fatherly love.","a":"For example, “green-sickness carrion” literally compares Juliet to a rotting corpse. This shows his earlier affection was conditional on her obedience — the instant she disobeys, his language turns violently dehumanising."},{"k":"short","n":6,"marks":3,"starter":"The Nurse advises Juliet to ___, even though she knows ___. This matters because ___.","q":"Explain why the Nurse's advice to marry Paris feels like such a significant betrayal, using a quotation.","a":"The Nurse tells Juliet “I think it best you married with the County,” even though she helped arrange Juliet's real marriage to Romeo herself. This matters because the one adult who knew the truth and supported Juliet now abandons her for practical convenience, leaving her completely alone."}]},{"type":"plenary","key":"h3-end","short":"Exit","mins":4,"title":"Exit ticket","ticket":[{"lvl":"core","q":"Give one insult Capulet uses against Juliet in this scene.","a":"For example: 'green-sickness carrion,' 'baggage,' or 'tallow-face.'"},{"lvl":"core","q":"What advice does the Nurse give Juliet, and why does it feel like a betrayal?","a":"She advises Juliet to marry Paris instead of waiting for Romeo — a betrayal because the Nurse helped arrange Juliet's real marriage and knows the truth, yet abandons it for convenience."},{"lvl":"stretch","q":"Explain how Shakespeare uses dramatic irony across this whole scene, from Lady Capulet's curse to Capulet's fury. Use one quotation.","a":"Nearly every line carries a meaning the speaker doesn't intend — for example, Lady Capulet's 'I would the fool were married to her grave!' is meant as an insult but becomes an accurate prophecy, since the audience already knows how the play ends."}],"next":"Next: Act 4 — Juliet turns to Friar Laurence for a desperate solution to avoid marrying Paris."}]}],"QUIZ":[{"q":"Why does Romeo say banishment is worse than death?","opts":["Because it costs him money","Because it separates him from Juliet completely","Because he will be publicly shamed","Because the Prince changed his mind twice"],"correct":1,"why":"Romeo argues that a world without Juliet in it is not a world at all — so exile from Verona is exile from everything that matters to him."},{"q":"What does Friar Laurence accuse Romeo of behaving like, during his rebuke?","opts":["A king","A beast","A saint","A soldier"],"correct":1,"why":"The Friar says Romeo's ‘wild acts denote / The unreasonable fury of a beast’ — his grief has become uncontrolled and, in the Friar's eyes, unmanly."},{"q":"What does the Friar's plan actually ask Romeo to do?","opts":["Turn himself in to the Prince","Visit Juliet tonight in secret, then flee to Mantua","Leave Verona immediately without seeing Juliet","Ask the Prince for a pardon in person"],"correct":1,"why":"The Friar tells Romeo to spend the night with Juliet, then escape to Mantua before the watch is set, and wait there for news."},{"q":"In Scene 3.4, who arranges Juliet's marriage to Paris?","opts":["Juliet and Paris together","Lady Capulet alone","Lord Capulet, without asking Juliet","The Friar"],"correct":2,"why":"Capulet makes the decision on Juliet's behalf and only afterwards sends Lady Capulet to ‘acquaint her’ with the news — Juliet has no say at all."},{"q":"Why is Scene 3.4 an example of dramatic irony?","opts":["Because Paris doesn't want to marry Juliet","Because the audience knows Juliet is already secretly married to Romeo","Because Capulet is lying about the date","Because Lady Capulet disagrees with the plan"],"correct":1,"why":"The audience already knows Juliet's marriage to Romeo, so Capulet's confident planning is painfully, unknowingly wrong from the moment he speaks."},{"q":"What does Juliet compare Romeo's exile to, using imagery of night and day?","opts":["A storm that never ends","A bird that cannot fly","The lark that signals dawn is coming","A wound that will not heal"],"correct":2,"why":"In the opening of 3.5, Juliet desperately tries to argue the lark is really a nightingale, to keep believing it is still night and Romeo doesn't have to leave."},{"q":"What does Lady Capulet say she wishes, before she knows Juliet is listening seriously?","opts":["That Juliet would marry Romeo openly","That Juliet were married to her grave","That Tybalt were still alive","That Paris would leave Verona"],"correct":1,"why":"‘I would the fool were married to her grave!’ is meant as an angry exaggeration — but it turns out to be a chilling prediction of what actually happens."},{"q":"What does Capulet threaten Juliet with when she refuses to marry Paris?","opts":["Sending her to a convent","Disowning her and casting her out","Reporting her to the Prince","Cancelling the wedding permanently"],"correct":1,"why":"Capulet tells her to marry Paris or never look him in the face again — essentially threatening to disown his own daughter."},{"q":"What does the phrase ‘my fingers itch’ suggest about Capulet?","opts":["He is nervous","He is close to physically striking Juliet","He wants to write a letter","He is impatient to leave the room"],"correct":1,"why":"It's a barely restrained threat of violence against his own daughter — showing how far his fury has escalated."},{"q":"What advice does the Nurse give Juliet after Capulet's outburst?","opts":["To run away with Romeo","To confess everything to her parents","To marry Paris, since Romeo is as good as dead to her","To ask the Prince for help"],"correct":2,"why":"The Nurse practically advises bigamy — marry Paris, since he's a better match and Romeo can't help her now. This shatters Juliet's trust in her."},{"q":"Where does Juliet say she is going at the end of Scene 3.5, and why does it matter?","opts":["To Mantua, to find Romeo","To the Friar's cell, supposedly for confession","To the Prince, to beg for mercy","To her room, to sleep"],"correct":1,"why":"She tells her mother she's going to be ‘shriven’ (confessed) by Friar Laurence — but her real purpose is to seek a way out of the forced marriage, even hinting at suicide if nothing else works."},{"q":"What do Juliet's closing words of the scene hint at?","opts":["That she will obey her father after all","That she has a backup plan involving Paris","That she is willing to die rather than betray Romeo","That she plans to tell her mother the truth"],"correct":2,"why":"‘If all else fail, myself have power to die’ foreshadows the desperate measures she is willing to take — including, eventually, faking her own death."}]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<i class="sd">[$1]</i>').replace(/\n/g, "<br>");
const SHORT = { fate: "Fate", conflict: "Conflict", family: "Family", love: "Love", language: "Language", appearance: "Appearance", irony: "Irony", context: "Context", ahead: "Look ahead" };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ratings are the only thing kept on the device, and only if the browser allows it */
const RKEY = "rj-act3-ratings";
function loadRate() { try { return JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) { return {}; } }
function saveRate() { try { localStorage.setItem(RKEY, JSON.stringify(S.rate)); } catch (e) { /* storage unavailable */ } }

/* S.drawer: which side panel is open (null = closed). S.wide / S.mainHidden: how the two panes share the screen. S.focus: extract-only mode. */
const S = { view: "lesson", h: 0, s: 0, tag: "all", sel: null, scale: 1, drawer: null, wide: false, mainHidden: false, focus: false, gloss: true,
  rev: { tab: "quotes", tag: "all", quiz: null }, rate: loadRate(), battle: { r: 0, meter: 20, picked: null } };
const cur = () => DATA.hours[S.h].steps[S.s];
let DR = {}; /* drawers of the step on screen */

/* order notes by position in the text */
DATA.hours.forEach((h) => h.steps.forEach((st) => {
  if (st.type !== "extract") return;
  const posOf = (n) => {
    let i;
    if (n.stage) i = st.lines.findIndex((l) => l.k === "st" && l.key === n.stage);
    else { const ln = n.at !== undefined ? n.at : n.from; i = st.lines.findIndex((l) => l.k === "ln" && l.n === ln); }
    return i * 1000 + (n.phrase && !n.stage ? Math.max(0, (st.lines[i].t || "").indexOf(n.phrase)) : 0);
  };
  st.notes.forEach((n) => (n._pos = posOf(n)));
  st.notes.sort((a, b) => a._pos - b._pos);
}));

const tagOK = (n, tag) => tag === "all" || n.tags.includes(tag);
const match = (n) => tagOK(n, S.tag);
const visible = (st) => st.notes.filter(match);
const byId = (st, id) => st.notes.find((n) => n.id === id);

/* ---------- top bar: lessons menu + navigation ---------- */
function renderTop() {
  $("#lbl").textContent = S.view === "revise" ? "Revise" : DATA.hours[S.h].title;
  $("#lmenu").innerHTML = DATA.hours.map((h, i) =>
    `<button class="lm${S.view === "lesson" && i === S.h ? " on" : ""}" data-h="${i}"><b>${esc(h.title)}</b><small>${esc(h.subtitle)}</small></button>`).join("") +
    `<button class="lm rev${S.view === "revise" ? " on" : ""}" data-view="revise"><b>Revise</b><small>Practise at home</small></button>`;
}
function renderNav() {
  const nav = $("#nav");
  if (S.view === "revise") {
    const tabs = [["quotes", "Key quotes"], ["quiz", "Quick quiz"], ["gaps", "Gap-fills"], ["ready", "Am I ready?"]];
    nav.innerHTML = `<div class="tabs2" role="tablist">${tabs.map(([k, l]) => `<button class="tab${S.rev.tab === k ? " on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>`;
    return;
  }
  const h = DATA.hours[S.h], n = h.steps.length;
  const first = S.h === 0 && S.s === 0;
  const lastStep = S.s === n - 1, lastAll = S.h === DATA.hours.length - 1 && lastStep;
  const nextLabel = !lastStep ? `Next: ${esc(h.steps[S.s + 1].short)}` : lastAll ? "Finished" : "Next lesson";
  nav.innerHTML =
    `<button class="btn back" data-act="prev" ${first ? "disabled" : ""} aria-label="${S.s === 0 && !first ? "Last lesson" : "Back"}"><i class="ic ic-back"></i><span class="tx">${S.s === 0 && !first ? "Last lesson" : "Back"}</span></button>` +
    `<ol class="steps">` + h.steps.map((s, i) =>
      `<li class="${i < S.s ? "done" : ""}"><button class="stp ${s.type}${i === S.s ? " on" : ""}${i < S.s ? " done" : ""}" data-s="${i}" title="${esc(s.short)} · about ${s.mins} min" ${i === S.s ? 'aria-current="step"' : ""}><span class="pn">${i + 1}</span><span class="pl">${esc(s.short)}</span></button></li>`).join("") + `</ol>` +
    `<button class="btn primary next" data-act="next" ${lastAll ? "disabled" : ""}><span class="tx">${nextLabel}</span><i class="ic ic-next"></i></button>`;
}

/* ---------- bottom bar: theme filters (notes) ---------- */
function chipRow(notes, active) {
  const counts = {};
  notes.forEach((n) => n.tags.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  return `<span class="fl">Show notes about</span><button class="chip${active === "all" ? " on" : ""}" data-tag="all">All (${notes.length})</button>` +
    Object.keys(DATA.TAGS).filter((t) => counts[t]).map((t) =>
      `<button class="chip tg-${t}${active === t ? " on" : ""}" data-tag="${t}"><i class="dot"></i>${esc(SHORT[t])} (${counts[t]})</button>`).join("");
}
function renderFilters() {
  const el = $("#filters");
  if (S.view === "revise") {
    if (S.rev.tab !== "quotes") { el.hidden = true; return; }
    el.hidden = false; el.innerHTML = chipRow(reviseNotes().map((x) => x.n), S.rev.tag); return;
  }
  const st = cur();
  if (st.type !== "extract") { el.hidden = true; return; }
  el.hidden = false;
  const has = new Set(); st.notes.forEach((n) => n.tags.forEach((t) => has.add(t)));
  if (S.tag !== "all" && !has.has(S.tag)) S.tag = "all";
  el.innerHTML = chipRow(st.notes, S.tag);
}

/* ---------- shared pieces ---------- */
function qaCards(qa) {
  return qa.map((q) => `<div class="qa ${q.lvl || ""}" role="button" tabindex="0" data-qa>${q.lvl ? `<span class="lv">${q.lvl === "core" ? "Core" : "Stretch"}</span>` : ""}<div class="qq">${esc(q.q)}</div><div class="aa">${esc(q.a)}</div></div>`).join("");
}
function ratingHTML(h) {
  const A = DATA.hours[h].aims;
  const items = [...A.sc, A.stretch];
  return items.map((t, i) => {
    const v = S.rate[h + ":" + i];
    return `<div class="rate"><p>${i === A.sc.length ? "<b>Stretch:</b> " : ""}${esc(t)}</p><div class="rbtns">` +
      ["Not yet", "Nearly", "Got it"].map((l, k) => `<button class="rb${v === k ? " on" : ""}" data-rate="${h}:${i}:${k}">${l}</button>`).join("") + `</div></div>`;
  }).join("");
}
function clozeParts(text) {
  let i = 0;
  const html = esc(text).replace(/\{\{(.+?)\}\}/g, (m, a) => { i++; return `<span class="gap" data-gap role="button" tabindex="0"><sup>${i}</sup><span class="ans">${esc(a)}</span></span>`; });
  const bank = [...text.matchAll(/\{\{(.+?)\}\}/g)].map((m) => m[1]).sort((a, b) => a.localeCompare(b));
  return { html, bank };
}
function hingeHTML(hg) {
  return `<div class="hinge"><div class="lab">Quick check: vote, then reveal</div><p class="hq">${esc(hg.q)}</p>` +
    hg.opts.map((o, i) => `<button class="opt" data-hinge="${i}">${"ABCD"[i]}&nbsp; ${esc(o)}</button>`).join("") +
    `<div class="row"><button class="ghost small" data-act="hingeshow">Show answer</button></div><div class="hres" hidden></div></div>`;
}
const ideas = (items) => items.map((i) => `<div class="idea"><b>${esc(i.h)}</b><p>${esc(i.t)}</p></div>`).join("");

/* ---------- the extract ---------- */
function annSpans(text, notes) {
  const marks = [];
  notes.forEach((n) => { const i = text.indexOf(n.phrase); if (i >= 0) marks.push({ s: i, e: i + n.phrase.length, n }); });
  marks.sort((a, b) => a.s - b.s);
  let out = "", p = 0;
  marks.forEach((m) => {
    out += fmt(text.slice(p, m.s));
    out += `<span class="ann${match(m.n) ? "" : " dim"}" data-note="${m.n.id}" role="button" tabindex="0">${fmt(text.slice(m.s, m.e))}</span>`;
    p = m.e;
  });
  return out + fmt(text.slice(p));
}
function quoteOf(st, n) {
  if (n.phrase) return n.phrase;
  const ls = st.lines.filter((l) => l.k === "ln" && l.n >= n.from && l.n <= n.to).map((l) => l.t);
  return ls.length > 2 ? ls[0] + " … " + ls[ls.length - 1] : ls.join(" / ");
}
function notePanel(st, n) {
  const vis = visible(st), idx = vis.findIndex((x) => x.id === n.id);
  const tiers = (n.support || n.stretch)
    ? `<div class="tierbtns">${n.support ? `<button class="ghost small" data-act="tog" data-t="sup">Need a starter?</button>` : ""}${n.stretch ? `<button class="ghost small" data-act="tog" data-t="str">Push further</button>` : ""}</div>` +
      (n.support ? `<div class="tier sup" hidden><b>Sentence starter</b>${esc(n.support)}</div>` : "") +
      (n.stretch ? `<div class="tier str" hidden><b>Stretch question</b>${esc(n.stretch)}</div>` : "")
    : "";
  return `<div class="ptop"><span>Note ${idx + 1} of ${vis.length}</span></div>` +
    `<p class="q">${fmt(quoteOf(st, n))}</p><h3>${esc(n.title)}</h3>` +
    `<div class="lab">In plain English</div><p>${esc(n.meaning)}</p>` +
    `<div class="lab">Why it matters</div><p>${esc(n.effect)}</p>` +
    (n.ask ? `<div class="ask"><b>Ask the class</b><p>${esc(n.ask)}</p></div>` : "") + tiers +
    `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div>` +
    `<div class="notenav"><button data-act="pn">◀ Previous note</button><button data-act="nn">Next note ▶</button></div>`;
}
function scenePanel(st) {
  return `<p class="lead">${esc(st.setup)}</p>` +
    (st.think ? `<div class="think"><b>Think first</b><p>${esc(st.think)}</p><button class="ghost small" data-act="timer" data-sec="${st.thinkSecs || 30}">Start timer</button></div>` : "") +
    `<button class="ghost" data-act="firstnote">Open the first note</button>`;
}

/* ---------- what each step shows: one main focus, the rest in drawers ---------- */
const VIEW = {
  aims(st) {
    const A = DATA.hours[S.h].aims;
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: A.bridge || "", rail: "Aims",
      body: `<div class="inner aimsbody"><div class="li"><div class="lab">Learning intention</div><p>${esc(A.li)}</p></div>` +
        `<div class="sc"><div class="lab">Success criteria: by the end of the lesson I can…</div><ul>${A.sc.map((x) => `<li>${esc(x)}</li>`).join("")}</ul><p class="stretchsc"><b>Stretch:</b> ${esc(A.stretch)}</p></div></div>`,
      drawers: [
        { id: "donow", label: "Do now", cta: true, title: st.doNow.title, html: () => `<p class="hint">Talk in pairs first. Tap a question to check.</p>${qaCards(st.doNow.qa)}<div class="row"><button class="ghost" data-act="timer" data-sec="60">Start a 1-minute timer</button></div>` },
        { id: "word", label: "Word of the lesson", title: "Word of the lesson", html: () => `<div class="word"><b>${esc(A.word.w)}</b> means ${esc(A.word.m)} ${esc(A.word.eg)}</div>` },
      ],
    };
  },
  context(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.lead, rail: "Cards",
      body: `<div class="inner"><div class="cards">${st.blocks.map((b) => `<div class="fact card" role="button" tabindex="0" data-reveal><h3>${esc(b.h)}</h3><p class="prompt">${esc(b.prompt || "")}</p><p class="txt">${esc(b.t)}</p><span class="tap">Talk first, then tap to check</span></div>`).join("")}</div></div>`,
      drawers: [{ id: "ideas", label: st.side.title, title: st.side.title, html: () => ideas(st.side.items) }],
    };
  },
  extract(st) {
    const phr = {}, rng = {}, stg = {};
    st.notes.forEach((n) => {
      if (n.phrase) { if (n.stage) (stg[n.stage] = stg[n.stage] || []).push(n); else (phr[n.at] = phr[n.at] || []).push(n); }
      else for (let i = n.from; i <= n.to; i++) rng[i] = n;
    });
    const glossHTML = (l) => S.gloss && l.g ? `<div class="gl"><span class="glab">Plain English</span>${esc(l.g)}</div>` : "";
    const body = st.lines.map((l) => {
      if (l.k === "sp") return `<div class="sp">${esc(l.t)}</div>`;
      if (l.k === "gap") return `<div class="gapline">${fmt(l.t)}</div>`;
      if (l.k === "st") return `<div class="stg">${l.key && stg[l.key] ? annSpans(l.t, stg[l.key]) : fmt(l.t)}</div>`;
      const r = rng[l.n];
      const num = l.n % 5 === 0 ? l.n : "";
      if (r) return `<div class="ln rng${match(r) ? "" : " dim"}" data-note="${r.id}" role="button" tabindex="0"><span class="num">${num}</span><span class="tx">${fmt(l.t)}</span>${glossHTML(l)}</div>`;
      return `<div class="ln"><span class="num">${num}</span><span class="tx">${annSpans(l.t, phr[l.n] || [])}</span>${glossHTML(l)}</div>`;
    }).join("");
    return {
      kick: `${st.label} · about ${st.mins} min`, title: st.title, sub: st.sub, rail: "Extract", focus: true,
      actions: `<button class="tb${S.gloss ? " on" : ""}" data-act="glosstoggle" aria-pressed="${S.gloss}">Plain English ${S.gloss ? "on" : "off"}</button>`,
      body: `<div class="lines${S.gloss ? "" : " noglo"}">${body}</div><div class="foot">Tap an underlined phrase or highlighted line to open its note. The small grey line under each passage is a plain-English paraphrase to help you read independently — the highlighted notes are the ones that matter most for themes and exam questions. Text: Folger Shakespeare Library edition (folger.edu). Line numbers as printed there.</div>`,
      drawers: [
        { id: "scene", label: "Before you read", title: "Before you read", cta: !!st.think, html: () => scenePanel(st) },
        { id: "note", label: () => `Notes (${visible(st).length})` },
      ],
    };
  },
  link(st) {
    const { html, bank } = clozeParts(st.text);
    const drawers = [];
    if (st.hinge) drawers.push({ id: "hinge", label: "Quick check", cta: true, title: "Quick check", html: () => hingeHTML(st.hinge) });
    if (st.ext) drawers.push({ id: "ext", label: "Stretch", title: "Stretch", html: () => `<p class="stretchsc"><b>Stretch:</b> ${esc(st.ext)}</p>` });
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Read aloud and tap each gap to reveal the word.", rail: "Gap-fill",
      actions: `<button class="tb" data-act="reveal">Reveal all</button>`,
      body: `<div class="inner"><div class="lab">Word bank</div><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div><p class="cloze">${html}</p></div>`,
      drawers,
    };
  },
  plenary(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Answer on your handout first. Then tap a question to check.", rail: "Exit ticket",
      body: `<div class="inner">${qaCards(st.ticket)}</div>`,
      drawers: [
        { id: "rate", label: "Rate yourself", cta: true, title: "Rate yourself", html: () => `<p class="hint">How well can you do each of today’s success criteria?</p><div id="ratings">${ratingHTML(S.h)}</div>` },
        { id: "next", label: "What’s next", title: "What’s next", html: () => `<div class="track"><p>${esc(st.next)}</p></div>` },
      ],
    };
  },
  practice(st) {
    const kind = { mc: "Multiple choice", tf: "True or false", match: "Matching", short: "Write your answer" };
    const cards = st.qs.map((q) => {
      let body = `<div class="qq">${esc(q.q)}</div>`;
      if (q.k === "mc") body += `<ol class="opts opts-a">${q.opts.map((o) => `<li>${esc(o)}</li>`).join("")}</ol>`;
      if (q.k === "tf") body += `<ul class="opts">${q.items.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`;
      if (q.k === "match") body += `<div class="mt"><ul>${q.left.map((o) => `<li>${esc(o)}</li>`).join("")}</ul><ul>${q.right.map((o) => `<li>${esc(o)}</li>`).join("")}</ul></div>`;
      const ms = q.ms ? `<ul class="ms">${q.ms.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : "";
      return `<div class="qa" role="button" tabindex="0" data-qa><span class="lv">${kind[q.k]} · ${q.marks} mark${q.marks > 1 ? "s" : ""}</span>${body}<div class="aa">${esc(q.a)}${ms}</div></div>`;
    }).join("");
    const mins = Math.round((st.timer || 300) / 60);
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Questions",
      actions: `<button class="tb" data-act="timer" data-sec="${st.timer || 300}">${mins}-minute timer</button>`,
      body: `<div class="inner">${cards}</div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
  assess(st) {
    return { raw: `<section class="pane wide assess"><h2>${esc(st.title)}</h2><p class="sub">${esc(st.sub || "")}</p>` +
      `<div class="row">${st.presets.map((m) => `<button class="ghost primary big" data-act="timer" data-sec="${m * 60}">Start ${m} minutes</button>`).join("")}<button class="ghost big" data-act="tstop">Stop timer</button></div></section>`, drawers: [] };
  },
  spot(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Spot the irony",
      body: `<div class="inner">` + st.items.map((it, i) => `<div class="spotitem" role="button" tabindex="0" data-spot="${i}"><p class="sq">${esc(it.t)}</p><p class="sw" hidden>${esc(it.why)}</p></div>`).join("") +
        `<div class="row"><button class="ghost primary" data-act="spotcheck">Check my answers</button><button class="ghost" data-act="spotreset">Start again</button></div><p class="score" id="spotscore"></p></div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
  battle(st) {
    const B = S.battle, R = st.rounds, done = B.r >= R.length;
    let body;
    if (done) {
      body = `<div class="bcard"><p class="score">${B.meter >= 100 ? "Macbeth is settled." : "Macbeth is nearly convinced."}</p><p class="hres">${esc(st.end)}</p><button class="ghost primary" data-act="brestart">Play again</button></div>`;
    } else {
      const rd = R[B.r], p = B.picked;
      body = `<div class="bcard"><span class="lab">Round ${B.r + 1} of ${R.length}: Macbeth says</span><p class="q">${esc(rd.doubt)}</p><span class="lab">Lady Macbeth: choose your tactic</span>` +
        rd.opts.map((o, i) => `<button class="opt${p !== null ? (o.best ? " right" : i === p ? " wrong" : "") : ""}" data-bopt="${i}" ${p !== null ? "disabled" : ""}>${String.fromCharCode(65 + i)}&nbsp; ${esc(o.t)}</button>`).join("") +
        (p !== null ? `<p class="hres"><b>${rd.opts[p].best ? "Strong choice." : "Not quite."}</b> ${esc(rd.opts[p].why)}</p><button class="ghost primary" data-act="bnext">${B.r + 1 === R.length ? "See the result" : "Next round"}</button>` : "") + `</div>`;
    }
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Battle",
      headExtra: `<div class="mhead"><span>Macbeth’s resolve</span><div class="meter" role="img" aria-label="Macbeth’s resolve ${B.meter} percent"><div class="bar" style="width:${B.meter}%"></div></div><b>${B.meter}%</b></div>`,
      body: `<div class="inner">${body}</div>`,
      drawers: [{ id: "quote", label: "Use a quotation", title: "Use a quotation", html: () => `<div class="idea"><b>Use a quotation</b><p>Every strong tactic comes from a line in Scene 7. Say which line you would quote.</p></div><p class="hint">At 100% Macbeth is ready to go through with it.</p>` }],
    };
  },
};

/* ---------- putting a step on screen ---------- */
function mainMarkup(v) {
  if (v.raw) return v.raw;
  const btns = v.drawers.map((d) => `<button class="tb${d.cta ? " cta" : ""}" data-drawer="${d.id}" aria-pressed="false">${esc(typeof d.label === "function" ? d.label() : d.label)}</button>`).join("");
  const focus = v.focus ? `<button class="tb" data-act="focus" title="Show only the extract (F)"><i class="ic ic-focus"></i>Focus</button>` : "";
  return `<section class="pane main" id="mainpane"><div class="phead"><div class="pt"><span class="kick">${esc(v.kick)}</span><h2>${esc(v.title)}</h2>${v.sub ? `<p class="sub">${esc(v.sub)}</p>` : ""}</div>` +
    `<div class="ptools">${btns}${v.actions || ""}${focus}</div>${v.headExtra || ""}</div><div class="pbody" id="script">${v.body}</div></section>`;
}
const drawerMarkup = () =>
  `<aside class="pane drawer" id="drawer" hidden aria-label="Side panel"><div class="dhead"><h3 id="dtitle"></h3><div class="dtools">` +
  `<button class="tb" data-act="dwide" title="Make this panel wider or narrower"><i class="ic ic-wide"></i><span id="lw">Wider</span></button>` +
  `<button class="tb" data-act="dfull" title="Hide the main pane to use the full width"><i class="ic ic-full"></i><span id="lf">Hide</span></button>` +
  `<button class="ib" data-act="dclose" aria-label="Close" title="Close (Esc)"><i class="ic ic-close"></i></button></div></div><div class="dbody" id="panel" aria-live="polite"></div></aside>` +
  `<button class="railtab" id="mainrail" data-act="showmain" hidden></button>`;

function mount(keep) {
  const el = $("#stage");
  if (S.view === "revise") { el.innerHTML = reviseHTML(); S.drawer = null; layout(); el.firstElementChild.scrollTop = 0; return; }
  const st = cur();
  const v = VIEW[st.type](st);
  DR = {}; v.drawers.forEach((d) => (DR[d.id] = d));
  const keepTop = keep && $("#script") ? $("#script").scrollTop : 0;
  if (!keep) { S.drawer = null; S.wide = false; S.mainHidden = false; S.sel = null; }
  el.innerHTML = mainMarkup(v) + drawerMarkup();
  S.rail = (v.rail || "main pane").toLowerCase();
  const rail = $("#mainrail"); if (rail) rail.textContent = "Show " + S.rail;
  if (S.drawer && S.drawer !== "note" && !DR[S.drawer]) S.drawer = null;
  if (S.drawer === "note" && !S.sel) S.drawer = null;
  layout();
  if (S.sel) markSel();
  const sc = $("#script"); if (sc) sc.scrollTop = keepTop;
}
function markSel() { document.querySelectorAll("[data-note]").forEach((el) => el.classList.toggle("on", el.dataset.note === S.sel)); }
function layout() {
  const c = $("#stage"), d = $("#drawer");
  const has = !!S.drawer && !!d;
  c.classList.toggle("has-drawer", has);
  c.classList.toggle("wide", has && S.wide);
  c.classList.toggle("mainhidden", has && S.mainHidden);
  if (d) d.hidden = !has;
  const rail = $("#mainrail"); if (rail) rail.hidden = !(has && S.mainHidden);
  document.querySelectorAll(".tb[data-drawer]").forEach((b) => { const on = b.dataset.drawer === S.drawer; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  if (has) { fillDrawer(); $("#lw").textContent = S.wide ? "Narrower" : "Wider"; $("#lf").textContent = (S.mainHidden ? "Show " : "Hide ") + S.rail; }
}
function fillDrawer() {
  const st = cur();
  let title, html;
  if (S.drawer === "note") {
    const n = S.sel && byId(st, S.sel);
    if (!n) { closeDrawer(); return; }
    title = "Notes"; html = notePanel(st, n);
  } else { const dd = DR[S.drawer]; title = dd.title || (typeof dd.label === "string" ? dd.label : ""); html = dd.html(); }
  $("#dtitle").textContent = title;
  $("#panel").innerHTML = html;
  $("#panel").scrollTop = 0;
}
function openDrawer(id) { S.drawer = id; layout(); }
function closeDrawer() {
  if (S.drawer === "note") S.sel = null;
  S.drawer = null; S.wide = false; S.mainHidden = false; markSel(); layout();
}
function select(id) {
  S.sel = id; S.drawer = "note"; markSel(); layout();
  const first = document.querySelector(`[data-note="${id}"]`);
  if (first) setTimeout(() => first.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" }), 40);
}
function stepNote(d) {
  const st = cur(), vis = visible(st);
  if (!vis.length) return;
  let i = vis.findIndex((n) => n.id === S.sel);
  i = i < 0 ? (d > 0 ? 0 : vis.length - 1) : (i + d + vis.length) % vis.length;
  select(vis[i].id);
}
function setFocus(on) {
  if (on && (S.view !== "lesson" || cur().type !== "extract")) return;
  S.focus = on;
  document.body.classList.toggle("focus", on);
  $("#fctl").setAttribute("aria-hidden", String(!on));
  if (on) setTimeout(() => $("#unfocus").focus({ preventScroll: true }), 400);
  const sc = $("#script"); if (sc && on) sc.scrollTop = sc.scrollTop;
}

/* ---------- spot the irony ---------- */
function spotCheck() {
  const st = cur(), total = st.items.filter((i) => i.irony).length;
  let hit = 0, wrong = 0;
  document.querySelectorAll(".spotitem").forEach((el) => {
    const it = st.items[+el.dataset.spot], picked = el.classList.contains("picked");
    el.classList.remove("ok", "bad", "miss", "none");
    if (picked && it.irony) { el.classList.add("ok"); hit++; }
    else if (picked) { el.classList.add("bad"); wrong++; }
    else if (it.irony) el.classList.add("miss");
    else el.classList.add("none");
    el.querySelector(".sw").hidden = false;
  });
  $("#spotscore").textContent = `You found ${hit} of ${total} ironic lines` + (wrong ? ` and picked ${wrong} that ${wrong === 1 ? "is" : "are"} not dramatic irony.` : ".");
}

/* ---------- revise mode (for home) ---------- */
function reviseNotes() {
  const out = [];
  DATA.hours.forEach((h) => h.steps.filter((s) => s.type === "extract").forEach((st) => st.notes.filter((n) => n.revise).forEach((n) => out.push({ st, n }))));
  return out;
}
function refText(st, n) {
  const ln = n.at !== undefined ? `line ${n.at}` : n.from !== undefined ? (n.from === n.to ? `line ${n.from}` : `lines ${n.from}–${n.to}`) : "";
  return `Act ${st.scene.split(".")[0]} Scene ${st.scene.split(".")[1]}${ln ? ", " + ln : ""}`;
}
function reviseHTML() {
  const tabs = [["quotes", "Key quotes"], ["quiz", "Quick quiz"], ["gaps", "Gap-fills"], ["ready", "Am I ready?"]];
  const head = `<div class="head"><h2>Revise Act 3</h2><p class="intro">Try to answer before you reveal. Nothing here is marked, so mistakes are useful.</p></div>` ;
  let body = "";
  if (S.rev.tab === "quotes") {
    const all = reviseNotes();
    const cards = all.filter(({ n }) => tagOK(n, S.rev.tag));
    body = `<p class="intro">Read the quotation. Say what it shows about the character or the theme. Then tap to check.</p>` +
      `<div class="qgrid">${cards.map(({ st, n }) => `<div class="qcard" role="button" tabindex="0" data-qcard><p class="qt">${fmt(quoteOf(st, n))}</p><p class="qr">${esc(refText(st, n))}</p>` +
        `<div class="qb"><p><b>${esc(n.title)}.</b> ${esc(n.meaning)}</p><p>${esc(n.effect)}</p>${n.support ? `<p><b>Sentence starter:</b> ${esc(n.support)}</p>` : ""}${n.stretch ? `<p><b>Stretch:</b> ${esc(n.stretch)}</p>` : ""}` +
        `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div></div></div>`).join("")}</div>`;
  } else if (S.rev.tab === "quiz") {
    body = quizHTML();
  } else if (S.rev.tab === "gaps") {
    let n = 0;
    DATA.hours.forEach((h) => { let last = null; h.steps.forEach((st) => {
      if (st.type === "extract") last = st;
      if (st.type === "link") {
        n++;
        const { html, bank } = clozeParts(st.text);
